# A pull request's title must be a Conventional Commit: it becomes the squash-merged commit on main, which release-please
# reads for the next version and its changelog (CONTRIBUTING.md, docs/versioning.md). Only the title is read: the pull
# request's code is never checked out, so pull_request_target, which also runs for pull requests from forks, is safe.
# No game data is involved.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            revert
          requireScope: false
